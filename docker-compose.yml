version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: healthgrid
      POSTGRES_PASSWORD: healthgrid_password
      POSTGRES_DB: healthgrid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
